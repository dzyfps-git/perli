[package]
name = "perli"
version = "0.5.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
cfb = "0.14"
# Already in the tree through `cfb`; only a CLSID for a .msg written out is made with it.
uuid = "1"
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_PortableDevices", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_Media_MediaFoundation", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WNet", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_Marshal", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange", "Win32_System_Environment", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Pipes", "Win32_System_Power", "Win32_System_Registry", "Win32_System_RestartManager", "Win32_System_StationsAndDesktops", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_System_WindowsProgramming", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
# The `implement` macro names this crate directly. It is already in the tree through `windows`.
windows-core = "0.62"
zip = { version = "9.4.1", default-features = false, features = ["aes-crypto", "deflate-flate2", "deflate64", "bzip2", "lzma", "xz", "ppmd"] }
# The archives Windows Explorer opens besides ZIP. RAR is read only: its UnRAR code may be
# shipped in any app, but not used to make RAR files.
unrar-ng-sys = { version = "0.7.7", default-features = false, features = ["std"] }
sevenz-rust2 = { version = "0.25", default-features = false, features = ["aes256", "bzip2", "compress", "deflate", "ppmd"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
bzip2 = "0.6"
ruzstd = "0.9"
# Already in through the zip crate; Perli unlocks a locked Zstandard entry with them itself.
aes = "0.9"
hmac = "0.13"
pbkdf2 = "0.13"
sha1 = "0.11"
tar = "0.4"
cab = "0.6"
# `zip` leaves the backend open. This is the one already in the tree.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
# Windows' own TLS, which needs no crypto library of its own.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls"] }
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
quick-xml = "0.42.0"
rustysynth = "1.3.8"
# Already in the tree through `tauri`; only its timer is needed here.
tokio = { version = "1", features = ["time"] }
brotli-decompressor = "6"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "variable-fonts"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
brotli = "9"
